<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosetta Stone AI | Hieroglyphic Decoder</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --accent-color: #8b7355;
            --text-color: #2c2c2c;
            --card-bg: #ffffff;
            --border-color: #dcd6c8;
            --success-color: #4a6741;
        }

        body {
            font-family: 'Palatino', 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            border-bottom: 5px solid var(--accent-color);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 5px;
        }

        .container {
            max-width: 900px;
            margin: -50px auto 50px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }

        .upload-section {
            border: 2px dashed var(--accent-color);
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 30px;
            background: #faf9f6;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            background: #f0ede6;
        }

        .upload-section h2 {
            margin-top: 0;
            color: var(--accent-color);
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 12px 30px;
            cursor: pointer;
            background: var(--accent-color);
            color: white;
            border-radius: 5px;
            font-weight: bold;
            margin: 20px 0;
            transition: opacity 0.3s;
        }

        .custom-file-upload:hover {
            opacity: 0.9;
        }

        #decode-btn {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            width: 100%;
            display: none;
        }

        .results {
            display: none;
            margin-top: 40px;
            border-top: 2px solid var(--border-color);
            padding-top: 30px;
        }

        .result-box {
            background: #fdfcf9;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .result-box h4 {
            margin-top: 0;
            color: var(--accent-color);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        #extracted-text {
            font-size: 2rem;
            margin: 10px 0;
            text-align: center;
        }

        #translation {
            font-size: 1.2rem;
            white-space: pre-wrap;
        }

        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--accent-color);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>ROSETTA STONE AI</h1>
        <p>Advanced Hieroglyphic Recognition & Translation</p>
    </div>

    <div class="container">
        <div class="upload-section" id="drop-zone">
            <h2>Upload Artifact Image</h2>
            <p>Select a clear photo of hieroglyphic text to decode</p>
            
            <label for="file-upload" class="custom-file-upload">
                CHOOSE IMAGE
            </label>
            <input id="file-upload" type="file" accept="image/*"/>
            
            <p id="file-name" style="color: var(--success-color); font-weight: bold;"></p>
            
            <button id="decode-btn">DECODE HIEROGLYPHS</button>
            <div class="loader" id="loader"></div>
        </div>

        <div class="results" id="results-area">
            <div class="result-box">
                <h4>Extracted Symbols</h4>
                <div id="extracted-text"></div>
            </div>

            <div class="result-box">
                <h4>Translation (English)</h4>
                <div id="translation"></div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Rosetta Stone AI Project | Decoding History with Neural Networks
    </footer>

    <script>
        const fileInput = document.getElementById('file-upload');
        const fileName = document.getElementById('file-name');
        const decodeBtn = document.getElementById('decode-btn');
        const resultsArea = document.getElementById('results-area');
        const loader = document.getElementById('loader');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileName.textContent = "Selected: " + this.files[0].name;
                decodeBtn.style.display = 'block';
                resultsArea.style.display = 'none';
            }
        });

        decodeBtn.addEventListener('click', async function() {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            // UI State
            decodeBtn.style.display = 'none';
            loader.style.display = 'block';
            resultsArea.style.display = 'none';

            try {
                const response = await fetch('/decode', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('extracted-text').textContent = data.extracted_text || "[No symbols detected]";
                    document.getElementById('translation').textContent = data.translation;
                    resultsArea.style.display = 'block';
                } else {
                    alert("Error: " + data.error);
                }
            } catch (error) {
                console.error("Error decoding:", error);
                alert("An error occurred during decoding.");
            } finally {
                loader.style.display = 'none';
                decodeBtn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
